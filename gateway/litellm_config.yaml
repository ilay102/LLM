# LiteLLM Router model_list. Loaded by router/main.py at startup.
#
# v0.2.4 — DeepSeek V4 RE-TIERED based on empirical eval results:
#   - V4-Flash performed WORSE than Haiku/4o-mini on cheap-tier tasks
#     (verbose responses, lost net savings). REMOVED from cheap tier.
#   - V4-Pro placed in BALANCED tier — 7x cheaper than Sonnet at potentially
#     Sonnet-grade quality. This is the real test.
#   - R1 (reasoner) kept in frontier — should fire on actual reasoning prompts
#     (proofs, architecture, multi-step planning) where it can shine.
#
# DEEPSEEK NOTE: China-hosted. For tenants in finance, healthcare, defense,
# or EU-strict GDPR contexts, exclude `deepseek/*` from their `allowed_models`.
#
# Per-model `max_tokens` cap defensively limits verbosity. Clients can
# override via request body.

model_list:
  # ---------- TIER: cheap (classification, extraction, short Q&A) ----------
  - model_name: tier-cheap
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 500   # cap verbosity — most cheap tasks need <300
    model_info:
      input_cost_per_token: 0.0000008
      output_cost_per_token: 0.000004
    gateway_info:
      tier: cheap

  - model_name: tier-cheap
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 500
    model_info:
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
    gateway_info:
      tier: cheap

  # ---------- TIER: balanced (real work, code, structured output) ----------
  - model_name: tier-balanced
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 1500
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
    gateway_info:
      tier: balanced

  # DeepSeek V4-Pro — the cost-optimization play of the year.
  # $0.435/$0.87 per 1M (7x cheaper than Sonnet input, 17x cheaper output).
  # Strong on: code, structured output, JSON parsing, technical writing.
  # Weak on: subtle creative writing (judge often prefers Sonnet style).
  - model_name: tier-balanced
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 1500
    model_info:
      input_cost_per_token: 0.000000435  # $0.435 / 1M
      output_cost_per_token: 0.00000087  # $0.87 / 1M
    gateway_info:
      tier: balanced
      data_residency: china
      strengths: "code, JSON, structured tasks, technical writing"

  # ---------- TIER: frontier (reasoning, agents, complex code) ----------
  - model_name: tier-frontier
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 3000
    model_info:
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.000075
    gateway_info:
      tier: frontier

  # DeepSeek R1 (reasoner) — V4 thinking mode for serious reasoning.
  # Per docs: deepseek-reasoner alias = V4 thinking mode.
  # Pricing: $0.435/$0.87 (cache miss) — 35x cheaper than Opus.
  # Listed FIRST in frontier rotation so cost-sensitive tenants benefit by default.
  - model_name: tier-frontier
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 3000
    model_info:
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087
    gateway_info:
      tier: frontier
      data_residency: china
      strengths: "step-by-step reasoning, math proofs, multi-step planning"

# Fallback chain. LiteLLM rotates within a tier; falls back to next tier
# only when all deployments in current tier fail.
litellm_settings:
  fallbacks:
    - tier-cheap: ["tier-balanced"]
    - tier-balanced: ["tier-frontier"]
  num_retries: 2
  request_timeout: 60
  drop_params: true

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 30
  retry_after: 5
